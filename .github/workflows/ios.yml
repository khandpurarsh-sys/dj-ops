name: iOS build
on:
  workflow_dispatch:
    inputs:
      sign_and_upload:
        description: "Sign and upload to TestFlight (needs Apple secrets)"
        type: boolean
        default: false
  push:
    branches: [ios-app]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run prepare-www
      - name: Generate iOS project
        run: npx cap add ios
      - name: Deployment target 16.4
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.4/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.4'/" ios/App/Podfile
      - name: Sync web assets and plugins
        run: npx cap sync ios
      - name: Inject preview UI test driver
        if: ${{ !inputs.sign_and_upload }}
        run: cp native-ios/UITestAppDelegate.swift ios/App/App/AppDelegate.swift
      - name: App icon
        run: rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset && cp -R native-ios/AppIcon.appiconset ios/App/App/Assets.xcassets/AppIcon.appiconset
      - name: Build number from run
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" ios/App/App/Info.plist
      - name: Face ID permission text
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Used to unlock DJ Ops with your phone instead of typing the passphrase.'" ios/App/App/Info.plist
      - name: Light status bar icons (native chrome only)
        run: |
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :UIStatusBarStyle UIStatusBarStyleLightContent" ios/App/App/Info.plist
      - name: Export compliance declaration (exempt - OS-provided crypto only)
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
      - name: Install pods
        run: cd ios/App && pod install
      - name: Unsigned test build (simulator)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            IPHONEOS_DEPLOYMENT_TARGET=16.4 CODE_SIGNING_ALLOWED=NO build
      - name: Build synthetic roundtrip fixture
        if: ${{ !inputs.sign_and_upload }}
        run: |
          cp crypto.js /tmp/crypto.mjs
          node native-ios/make-roundtrip-fixture.mjs
      - name: Preview + dummy unlock-flow validation (simulator)
        if: ${{ always() && !inputs.sign_and_upload }}
        run: |
          set -e
          xcrun simctl create djops-preview "iPhone 16" || true
          UDID=$(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(v['udid'] for r,vs in d.items() if 'iOS' in r for v in vs if v['name']=='djops-preview'))")
          xcrun simctl boot $UDID || true
          xcrun simctl help biometric 2>&1 | head -12 || true
          xcrun simctl biometric enroll $UDID 2>&1 | tail -2 || true
          ( for i in $(seq 1 60); do xcrun simctl biometric match $UDID >/dev/null 2>&1 || true; sleep 2; done ) &
          MATCHER=$!
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name 'App.app' -path '*Debug-iphonesimulator*' | head -1)
          xcrun simctl install $UDID "$APP_PATH"
          mkdir -p preview
          # Launch 1: create vault with dummy passphrase, wrong-passphrase failure, correct unlock, enable phone unlock
          SIMCTL_CHILD_DJOPS_UITEST=1 SIMCTL_CHILD_DJOPS_WRONGPASS=1 xcrun simctl launch $UDID com.arsh.djops || true
          sleep 5
          xcrun simctl io $UDID screenshot preview/01-create-gate.png
          sleep 11
          xcrun simctl io $UDID screenshot preview/02-wrong-passphrase.png
          sleep 29
          xcrun simctl io $UDID screenshot preview/03-home-after-setup.png
          # Launch 2: phone unlock (Face ID auto-approved) after relaunch
          xcrun simctl terminate $UDID com.arsh.djops || true
          sleep 2
          SIMCTL_CHILD_DJOPS_UITEST=1 xcrun simctl launch $UDID com.arsh.djops || true
          sleep 8
          xcrun simctl io $UDID screenshot preview/04-relaunch.png
          sleep 10
          xcrun simctl io $UDID screenshot preview/05-home-after-faceid.png
          # Launch 3: phone unlock denied, then passphrase fallback
          kill $MATCHER 2>/dev/null || true
          xcrun simctl terminate $UDID com.arsh.djops || true
          sleep 2
          SIMCTL_CHILD_DJOPS_UITEST=1 SIMCTL_CHILD_DJOPS_FALLBACK=1 xcrun simctl launch $UDID com.arsh.djops || true
          sleep 6
          xcrun simctl biometric unmatch $UDID >/dev/null 2>&1 || true
          sleep 2
          xcrun simctl biometric unmatch $UDID >/dev/null 2>&1 || true
          sleep 4
          xcrun simctl io $UDID screenshot preview/06-unlock-denied.png
          sleep 18
          xcrun simctl io $UDID screenshot preview/07-home-after-fallback.png
          # Launch 4: seeded known identity + synthetic encrypted-feed decrypt roundtrip
          xcrun simctl terminate $UDID com.arsh.djops || true
          xcrun simctl uninstall $UDID com.arsh.djops || true
          xcrun simctl install $UDID "$APP_PATH"
          SEED_B64=$(base64 -w0 /tmp/dj-seed.json 2>/dev/null || base64 /tmp/dj-seed.json)
          SIMCTL_CHILD_DJOPS_UITEST=1 SIMCTL_CHILD_DJOPS_ROUNDTRIP=1 SIMCTL_CHILD_DJOPS_SEED_B64="$SEED_B64" xcrun simctl launch $UDID com.arsh.djops || true
          sleep 22
          xcrun simctl io $UDID screenshot preview/08-roundtrip.png
          sleep 10
          xcrun simctl io $UDID screenshot preview/09-roundtrip-late.png
          xcrun simctl shutdown $UDID || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.sign_and_upload }}
        with:
          name: ios-preview
          path: preview/*.png
      - name: Sign and upload to TestFlight
        if: ${{ inputs.sign_and_upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=16.4 CODE_SIGNING_ALLOWED=NO archive
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID
