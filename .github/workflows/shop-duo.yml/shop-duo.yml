name: shop-duo
on:
  push:
    branches: [duo-shots-ci]
permissions:
  contents: read
concurrency:
  group: shop-duo
  cancel-in-progress: false
jobs:
  duo-shots:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios-shop && xcodegen
      - name: Boot iPhone Duo simulator and build
        run: |
          set -e
          cd ios-shop
          xcrun simctl list devicetypes | grep -i duo || true
          SIM_ID=$(xcrun simctl list devices available | grep -i 'iPhone Duo' | head -1 | grep -oE '[0-9A-Fa-f-]{36}' | head -1)
          if [ -z "$SIM_ID" ]; then
            DT=$(xcrun simctl list devicetypes | grep -i 'iPhone Duo' | head -1 | sed -E 's/^.*\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]*)\).*$/\1/')
            RT=$(xcrun simctl list runtimes | grep -i 'iOS 27.1' | head -1 | sed -E 's/^.*(com\.apple\.CoreSimulator\.SimRuntime\.[^ ]*).*$/\1/')
            echo "creating duo sim, devicetype=$DT runtime=$RT"
            SIM_ID=$(xcrun simctl create DuoCI "$DT" "$RT")
          fi
          test -n "$SIM_ID"
          echo "SIM_ID=$SIM_ID" | tee sim_id.txt
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild build -project DressJetShop.xcodeproj -scheme DressJetShop \
            -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO
      - name: Probe fold controls
        run: |
          xcrun simctl help 2>&1 | grep -i -E 'fold|pose|hinge|display' || true
      - name: Duo captures
        run: |
          set -e
          cd ios-shop
          SIM_ID=$(cut -d= -f2 sim_id.txt)
          git clone --depth 1 https://github.com/ChrisThoma/devicehubctl /tmp/devicehubctl
          cd /tmp/devicehubctl
          swift build -c release 2>&1 | tail -2
          cd -
          DH=/tmp/devicehubctl/.build/release/devicehubctl
          open -a DeviceHub || true
          sleep 5
          APP=$(ls -d build/dd/Build/Products/*-iphonesimulator/DressJetShop.app | head -1)
          xcrun simctl install "$SIM_ID" "$APP"
          xcrun simctl status_bar "$SIM_ID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          mkdir -p build/duo
          "$DH" "$SIM_ID" pose closed
          xcrun simctl launch "$SIM_ID" com.dressjet.shop
          sleep 8
          xcrun simctl io "$SIM_ID" screenshot --display=1 build/duo/duo-folded.png
          "$DH" "$SIM_ID" pose open
          sleep 8
          xcrun simctl io "$SIM_ID" screenshot --display=3 build/duo/duo-unfolded.png
          sips -g pixelWidth -g pixelHeight build/duo/duo-folded.png build/duo/duo-unfolded.png || true
      - name: Upload duo shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-shots
          path: ios-shop/build/duo/*.png
          retention-days: 7
          if-no-files-found: ignore
