name: shop-duo
on:
  push:
    branches: [duo-shots-ci-arm]
permissions:
  contents: read
concurrency:
  group: shop-duo
  cancel-in-progress: false
jobs:
  duo-shots:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios-shop && xcodegen
      - name: Boot iPhone Duo simulator and build
        run: |
          set -e
          cd ios-shop
          SIM_ID=$(xcrun simctl list devices available | grep -i 'iPhone Duo' | head -1 | grep -oE '[0-9A-Fa-f-]{36}' | head -1)
          if [ -z "$SIM_ID" ]; then
            DT=$(xcrun simctl list devicetypes | grep -i 'iPhone Duo' | head -1 | sed -E 's/^.*\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]*)\).*$/\1/')
            RT=$(xcrun simctl list runtimes | grep -i 'iOS 27.1' | head -1 | sed -E 's/^.*(com\.apple\.CoreSimulator\.SimRuntime\.[^ ]*).*$/\1/')
            echo "creating duo sim, devicetype=$DT runtime=$RT"
            SIM_ID=$(xcrun simctl create DuoCI "$DT" "$RT")
          fi
          test -n "$SIM_ID"
          echo "SIM_ID=$SIM_ID" | tee sim_id.txt
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild build-for-testing -project DressJetShop.xcodeproj -scheme DressJetShop \
            -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO
      - name: Probe fold controls
        run: |
          xcrun simctl help 2>&1 | grep -i -E 'fold|pose|hinge|display' || true
      - name: Duo captures
        run: |
          set -e
          cd ios-shop
          SIM_ID=$(cut -d= -f2 sim_id.txt)
          git clone --depth 1 https://github.com/ChrisThoma/devicehubctl /tmp/devicehubctl
          cd /tmp/devicehubctl
          swift build -c release 2>&1 | tail -2
          cd -
          DH=/tmp/devicehubctl/.build/release/devicehubctl
          open -a DeviceHub || true
          sleep 5
          xcrun simctl status_bar "$SIM_ID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          mkdir -p build/duo
          "$DH" "$SIM_ID" pose closed
          nohup xcodebuild test-without-building -project DressJetShop.xcodeproj -scheme DressJetShop \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -only-testing:DressJetShopUITests/DuoEntryUITests \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO > build/duo/uitest.log 2>&1 &
          UIPID=$!
          ENTERED="timeout"
          for i in $(seq 1 72); do
            if grep -q 'DUO-MARKER-ENTERED' build/duo/uitest.log 2>/dev/null; then ENTERED=yes; break; fi
            if grep -q 'DUO-MARKER-NO-ENTER' build/duo/uitest.log 2>/dev/null; then ENTERED=no-enter; break; fi
            if ! kill -0 "$UIPID" 2>/dev/null; then ENTERED=test-exited; break; fi
            sleep 5
          done
          echo "entered=$ENTERED"
          grep -E 'DUO-MARKER' build/duo/uitest.log | head -3 || true
          sleep 20
          xcrun simctl io "$SIM_ID" screenshot --display=1 build/duo/duo-folded.png
          "$DH" "$SIM_ID" pose open
          sleep 10
          xcrun simctl io "$SIM_ID" screenshot --display=3 build/duo/duo-unfolded.png
          kill "$UIPID" 2>/dev/null || true
          sips -g pixelWidth -g pixelHeight build/duo/duo-folded.png build/duo/duo-unfolded.png || true
          tail -5 build/duo/uitest.log || true
      - name: Upload duo shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-shots
          path: |
            ios-shop/build/duo/*.png
            ios-shop/build/duo/uitest.log
          retention-days: 7
          if-no-files-found: ignore
