name: fix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shopt -s nullglob
          for f in [0-9]*-*; do cp -f "$f" "$(echo "$f" | sed -E 's/^[0-9]+-//')"; git rm -q "$f"; done
          git add -A
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git commit -m "apply uploaded files" || echo "nothing to commit"
          git push
