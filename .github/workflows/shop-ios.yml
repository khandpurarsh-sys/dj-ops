name: shop-ios
on:
  push:
    branches: [shop-ios-ci]
    tags: ['ship-*']
permissions:
  contents: read
concurrency:
  group: shop-ios
  cancel-in-progress: false
env:
  BUILD_NO: "318"
jobs:
  proof:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          xcodebuild -showsdks | grep -q iphoneos27
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios-shop && xcodegen
      - name: Simulator proof, every orientation
        run: |
          set -e
          cd ios-shop
          SIM_ID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1)
          echo "simulator: $SIM_ID"
          xcrun simctl list devices available | grep "$SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild build -project DressJetShop.xcodeproj -scheme DressJetShop \
            -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO
          APP=$(ls -d build/dd/Build/Products/*-iphonesimulator/DressJetShop.app | head -1)
          xcrun simctl install "$SIM_ID" "$APP"
          xcrun simctl status_bar "$SIM_ID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          mkdir -p build/proof
          shot() { N=$1; W=$2; MODE=$3; shift 3
            xcrun simctl terminate "$SIM_ID" com.dressjet.shop 2>/dev/null || true
            xcrun simctl launch "$SIM_ID" com.dressjet.shop "$MODE" "$@"
            sleep "$W"; xcrun simctl io "$SIM_ID" screenshot "build/proof/$N.png"; }
          shot light-dock 4 -dockproof light
          shot light-nodock 4 -dockproof light nodock
          shot light-nomenu 4 -dockproof light nomenu
          shot dark-dock 4 -dockproof dark
          shot dark-nodock 4 -dockproof dark nodock
          shot dark-nomenu 4 -dockproof dark nomenu
          shot light-mini-dock 4 -dockproof light mini
          shot light-mini-nodock 4 -dockproof light mini nodock
          shot light-mini-nomenu 4 -dockproof light mini nomenu
          shot menu-portrait-dock 6 -menuproof
          shot menu-portrait-nodock 6 -menuproof nodock
          shot menu-landR-dock 6 -menuproof landR
          shot menu-landR-nodock 6 -menuproof landR nodock
          shot menu-landL-dock 6 -menuproof landL
          shot menu-landL-nodock 6 -menuproof landL nodock
          shot menu-portrait-inset-dock 6 -menuproof inset
          shot menu-landR-inset-dock 6 -menuproof landR inset
          shot menu-landL-inset-dock 6 -menuproof landL inset
          set +e; mkdir -p ../shots && cp build/proof/*.png ../shots/
          set +e
          python3 ../scripts/measure_dock.py build/proof; D=$?
          python3 ../scripts/measure_menu.py build/proof; M=$?
          echo "dock-measure exit=$D menu-measure exit=$M" | tee build/proof/exit-codes.txt
          test $D -eq 0 && test $M -eq 0
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof
          path: ios-shop/build/proof/*
          retention-days: 7
          if-no-files-found: ignore
  archive:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios-shop
          xcodegen
      - name: Signing material and ASC key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          P12_B64: ${{ secrets.DJOPS_DIST_P12_B64 }}
          P12_PASS: ${{ secrets.DJOPS_DIST_P12_PASSWORD }}
        run: |
          set -e
          mkdir -p ~/private_keys
          python3 - "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" <<'PYKEY'
          import os, sys
          k = os.environ['ASC_PRIVATE_KEY'].lstrip('\ufeff').strip()
          if k.startswith(chr(34)) and k.endswith(chr(34)):
              k = k[1:-1].strip()
          k = k.replace('\\n', chr(10))
          with open(sys.argv[1], 'w') as f:
              f.write(k + chr(10))
          
          PYKEY
          chmod 600 ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          grep -c 'BEGIN PRIVATE KEY' ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          KC=$RUNNER_TEMP/ci.keychain-db
          security create-keychain -p tmpkc "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p tmpkc "$KC"
          echo "$P12_B64" | base64 --decode > $RUNNER_TEMP/s.p12
          security import $RUNNER_TEMP/s.p12 -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k tmpkc "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          export CERT_FP=$( (openssl pkcs12 -in $RUNNER_TEMP/s.p12 -clcerts -nokeys -passin pass:"$P12_PASS" 2>/dev/null || openssl pkcs12 -legacy -in $RUNNER_TEMP/s.p12 -clcerts -nokeys -passin pass:"$P12_PASS") | openssl x509 -outform DER | openssl sha1 -r | awk '{print $1}')
          export ASC_KEY_PATH=$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          rm -f $RUNNER_TEMP/s.p12
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          python3 <<'PYEOF'
          import base64, hashlib, json, os, subprocess, time, urllib.request
          KID = os.environ['ASC_KEY_ID']; ISS = os.environ['ASC_ISSUER_ID']
          KEY = os.environ['ASC_KEY_PATH']; FP = os.environ['CERT_FP'].lower()
          def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          def jwt():
              h = b64u(json.dumps({'alg': 'ES256', 'kid': KID, 'typ': 'JWT'}, separators=(',', ':')).encode())
              n = int(time.time())
              p = b64u(json.dumps({'iss': ISS, 'iat': n, 'exp': n + 1200, 'aud': 'appstoreconnect-v1'}, separators=(',', ':')).encode())
              msg = (h + '.' + p).encode()
              r1 = subprocess.run(['openssl', 'dgst', '-sha256', '-sign', KEY], input=msg, capture_output=True)
              if r1.returncode == 0:
                  der = r1.stdout
                  idx = 2 if der[1] < 0x80 else 2 + (der[1] & 0x7f)
                  def ri(d, i):
                      ln = d[i + 1]; return d[i + 2:i + 2 + ln], i + 2 + ln
                  r, idx = ri(der, idx); s, _ = ri(der, idx)
                  return h + '.' + p + '.' + b64u(r.rjust(32, b'\0')[-32:] + s.rjust(32, b'\0')[-32:])
              print('openssl dgst failed, trying node:', r1.stderr.decode()[:300])
              node_js = 'const c=require("crypto"),f=require("fs");const m=Buffer.from(process.argv[1],"utf8");const s=c.sign("sha256",m,{key:f.readFileSync(process.argv[2]),dsaEncoding:"ieee-p1363"});process.stdout.write(s.toString("base64url"))'
              r2 = subprocess.run(['node', '-e', node_js, msg.decode(), KEY], capture_output=True)
              assert r2.returncode == 0, 'node sign failed: ' + r2.stderr.decode()[:300]
              return h + '.' + p + '.' + r2.stdout.decode().strip()
          def api(method, path, body=None):
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path, method=method, data=json.dumps(body).encode() if body else None, headers={'Authorization': 'Bearer ' + jwt(), 'Content-Type': 'application/json'})
              return json.load(urllib.request.urlopen(req, timeout=60))
          certs = api('GET', '/v1/certificates?filter[certificateType]=DISTRIBUTION&limit=50')['data']
          cid = None
          for c in certs:
              der = base64.b64decode(c['attributes']['certificateContent'])
              if hashlib.sha1(der).hexdigest().lower() == FP:
                  cid = c['id']; break
          assert cid, 'no ASC distribution certificate matches the imported p12'
          bid = api('GET', '/v1/bundleIds?filter[identifier]=com.dressjet.shop')['data'][0]['id']
          prof = None
          resp = api('GET', '/v1/profiles?filter[profileType]=IOS_APP_STORE&filter[profileState]=ACTIVE&include=certificates,bundleId&limit=200')
          for p in resp['data']:
              rel = p.get('relationships', {})
              if rel.get('bundleId', {}).get('data', {}).get('id') != bid: continue
              cids = [c['id'] for c in rel.get('certificates', {}).get('data', [])]
              if cid in cids:
                  prof = p; break
          if prof:
              print('reusing profile', prof['id'], prof['attributes']['name'])
              pid = prof['id']
          else:
              body = {'data': {'type': 'profiles', 'attributes': {'name': 'DressJet Shop CI appstore', 'profileType': 'IOS_APP_STORE'}, 'relationships': {'bundleId': {'data': {'type': 'bundleIds', 'id': bid}}, 'certificates': {'data': [{'type': 'certificates', 'id': cid}]}}}}
              pid = api('POST', '/v1/profiles', body)['data']['id']
              print('created profile', pid)
          prof = api('GET', '/v1/profiles/' + pid)['data']
          content = base64.b64decode(prof['attributes']['profileContent'])
          out = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/%s.mobileprovision' % prof['attributes'].get('uuid', prof['id']))
          open(out, 'wb').write(content)
          print('installed', out, len(content), 'bytes')
          PYEOF
      - name: Archive
        run: |
          cd ios-shop
          set -o pipefail
          xcodebuild archive -project DressJetShop.xcodeproj -scheme DressJetShop \
            -destination 'generic/platform=iOS' -archivePath build/DressJetShop.xcarchive \
            MARKETING_VERSION=1.0.1 CURRENT_PROJECT_VERSION=$BUILD_NO \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=8TG7VX985U \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=DressJet Shop CI appstore" 2>&1 | tee /tmp/archive.log | tail -40
      - name: Verify archive
        run: |
          set -e
          PL=$(ls ios-shop/build/DressJetShop.xcarchive/Products/Applications/*.app/Info.plist)
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL")
          E=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PL")
          echo "CFBundleVersion=$V ITSAppUsesNonExemptEncryption=$E"
          test "$V" = "$BUILD_NO" && test "$E" = "false"
      - name: Export and upload to TestFlight (proof job must pass first; group assignment is a separate step)
        run: |
          cd ios-shop
          set -o pipefail
          DEST=upload
          echo "destination: $DEST"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            "<key>destination</key><string>$DEST</string>" \
            '<key>signingStyle</key><string>manual</string>' \
            '<key>signingCertificate</key><string>Apple Distribution</string>' \
            '<key>teamID</key><string>8TG7VX985U</string>' \
            '<key>provisioningProfiles</key><dict><key>com.dressjet.shop</key><string>DressJet Shop CI appstore</string></dict>' \
            '</dict></plist>' > /tmp/export.plist
          xcodebuild -exportArchive -archivePath build/DressJetShop.xcarchive \
            -exportPath build/ipa -exportOptionsPlist /tmp/export.plist \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} 2>&1 | tee /tmp/export.log | tail -40
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs
          path: |
            /tmp/archive.log
            /tmp/export.log
          retention-days: 3
          if-no-files-found: ignore
