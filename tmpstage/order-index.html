:root{--navy:#0E2C46;--gold:#C0B090;--cream:#EFE6D2;--ink2:rgba(14,44,70,.6);--ink3:rgba(14,44,70,.45);--line:rgba(14,44,70,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#ececec}
body{font-family:DjAssistant,sans-serif;color:var(--navy)}
#phone{max-width:430px;margin:0 auto;background:#fff;position:relative;min-height:100vh;box-shadow:0 0 30px #0002}
#hw{position:sticky;top:0;z-index:20;height:0}
#hdr{padding:calc(24px + max(env(safe-area-inset-top),47px)) 20px 10px;background:transparent;transition:background .28s,color .28s;color:var(--cream)}
#hdr.light{background:#fff;color:var(--navy)}
.wm{font-family:DjCinzel;font-size:15px;letter-spacing:5.7px;text-align:center;margin-bottom:10px;padding-left:5.7px}
.hrow{display:flex;gap:12px;align-items:center}
.pill{flex:1;height:46px;border-radius:23px;display:flex;align-items:center;padding:0 18px;gap:10px;font-weight:500;font-size:14px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55)}
.pill span:last-child{opacity:.88}
#hdr.light .pill{background:rgba(255,255,255,.62);border-color:var(--line)}
.bag{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.55)}
#hdr.light .bag{background:rgba(255,255,255,.55);border-color:var(--line)}
#hero{height:100svh;min-height:560px;position:relative;background:#111;overflow:hidden}#hero .im{position:absolute;left:0;right:0;top:-16.28%;height:116.28%;background:center/cover no-repeat}
#hero .shop{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);padding:13px 34px;border-radius:30px;font-weight:600;font-size:11.5px;letter-spacing:3px;color:var(--cream);background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);white-space:nowrap}
#feed{display:grid;grid-template-columns:1fr 1fr;column-gap:15px;row-gap:30px;padding:0 15px;padding-top:0}
.card{min-width:0;position:relative}
.card.big{grid-column:1/-1;margin:4px -15px -4px}
.card.big .info{padding:0 15px}
.pager{position:relative;background:#E0E0E0;overflow:hidden;aspect-ratio:.75}
.card.big .pager{aspect-ratio:.8}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;height:100%;scroll-snap-align:start}
.pg img{width:100%;height:100%;display:block}
.pg img.fl{object-fit:contain;padding:12px}.card.big .pg img.fl{padding:18px}
.pg img.ph{object-fit:cover}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:3.2px;pointer-events:none}
.card.big .dots{bottom:10px;gap:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.55)}
.card.big .dots i{width:5px;height:5px}
.dots i.on{background:var(--gold)}
.info{padding-top:10px}
.irow{display:flex;align-items:center}
.itxt{flex:1;min-width:0}
.eb{font-weight:600;font-size:10.5px;letter-spacing:3.6px;color:var(--ink3);text-transform:uppercase}
.tt{font-family:DjCormorant;font-weight:500;font-size:18px;line-height:23.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--navy)}
.pr{font-weight:500;font-size:12.5px;color:var(--ink2);margin-top:4px}
.plus{width:44px;height:44px;border:0;background:none;font-size:26px;font-weight:200;color:var(--navy);cursor:pointer;font-family:DjAssistant}
.chips{display:flex;gap:10px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--gold);border-radius:15px;padding:6px 13px;font-size:12.5px;font-weight:600;letter-spacing:1px;color:var(--navy);background:none;font-family:DjAssistant}
.chip.na{border-color:var(--line);color:rgba(14,44,70,.2);font-weight:400}
.added{color:var(--gold);font-weight:600;font-size:12.5px;letter-spacing:1px;padding:8px 0}
#end{padding:34px 0 140px;text-align:center}
#end hr{border:0;height:1px;width:52px;background:var(--gold);margin:0 auto 12px}
#end div{font-family:DjCinzel;font-size:8.5px;letter-spacing:4px;color:rgba(192,176,144,.7)}
/* owner edit layer */
body.edit .pager{outline:0}
.ov{display:none}
body.edit .ov{display:block}
.num{position:absolute;top:6px;left:6px;background:#0E2C46dd;color:#fff;border-radius:6px;padding:2px 7px;font:600 12px DjAssistant;z-index:3}
.nw{position:absolute;top:6px;right:6px;background:var(--gold);color:var(--navy);border-radius:6px;padding:2px 7px;font:600 11px DjAssistant;z-index:3}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;padding:6px;background:linear-gradient(transparent,#0E2C46cc);z-index:3}
body.edit .dots{bottom:38px}
.ctl button{flex:1;border:0;border-radius:7px;padding:7px 2px;font:600 11.5px DjAssistant;background:#fffffff0;color:var(--navy);cursor:pointer}
.ctl .dh{flex:0 0 34px;cursor:grab;touch-action:none;font-size:15px;line-height:1}
.card.sel-ghost{opacity:.3}
#hid{display:none;padding:10px 15px 0}
body.edit #hid.has{display:block}
#hid h4{font:600 10.5px DjAssistant;letter-spacing:3px;text-transform:uppercase;color:var(--ink3);margin:10px 0}
.hrow2{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.hrow2 img{width:44px;height:58px;object-fit:cover;background:#E0E0E0}.hrow2 span{flex:1;font-family:DjCormorant;font-size:16px}
.hrow2 button{border:1px solid var(--gold);background:none;border-radius:8px;padding:6px 12px;color:var(--navy);font:600 12px DjAssistant}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:40;background:#0E2C46;color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 13px DjAssistant}
#bar button{border:0;border-radius:8px;padding:9px 12px;background:#fff;color:var(--navy);font:600 13px DjAssistant;cursor:pointer}
#bar button.pri{background:var(--gold)}#bar button:disabled{opacity:.4}
#bar .sp{flex:1}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;max-width:410px;width:calc(100% - 20px);z-index:41;padding:9px 12px;border-radius:8px;font:500 13px DjAssistant;background:#fff7d6;color:#333;display:none;box-shadow:0 2px 8px #0003}
#msg.ok{background:#dff5e1}#msg.err{background:#fde0e0}
#modal{display:none;position:fixed;inset:0;background:#000a;z-index:60;align-items:flex-start;justify-content:center;padding:20px}
#modal .box{background:#fff;border-radius:12px;max-width:430px;width:100%;max-height:88vh;display:flex;flex-direction:column}
#modal .hd{padding:12px;border-bottom:1px solid #eee;display:flex;flex-direction:column;gap:8px}
#modal input[type=text]{padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit}
#modal button{padding:9px;border:0;border-radius:8px;background:#eee;font:inherit}
#list{overflow:auto;padding:6px}.row{display:flex;gap:10px;align-items:center;padding:6px;border-radius:8px;cursor:pointer}.row:hover{background:#eef}.row img{width:44px;height:58px;object-fit:cover;border-radius:4px}
#load{padding:200px 20px;text-align:center;color:var(--ink3)}
